<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kauppalista - jaettu lista</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f2;
      color: #202124;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 520px);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.9rem, 8vw, 2.8rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 14px;
      font-size: 1rem;
      line-height: 1.55;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 10px;
      padding: 0 18px;
      border-radius: 8px;
      background: #126c55;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .hint {
      margin-top: 18px;
      color: #5f6368;
      font-size: 0.94rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #151612;
        color: #f3f3ec;
      }

      a.button {
        background: #65c7a5;
        color: #102019;
      }

      .hint {
        color: #c2c4bb;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Kauppalista - jaettu lista</h1>
    <p>Tämä kutsulinkki avataan Kauppalista-sovelluksessa.</p>
    <p>Jos sovellus ei avaudu automaattisesti, varmista että Kauppalista on asennettu ja kokeile avata linkki uudelleen.</p>
    <a class="button" id="openApp" href="#">Avaa sovelluksessa</a>
    <p class="hint">Linkin listId- ja invite-parametrit säilyvät avausta varten.</p>
  </main>

  <script>
    const currentUrl = new URL(window.location.href);
    const fallbackUrl = currentUrl.toString();
    const intentUrl =
      "intent://" +
      currentUrl.host +
      currentUrl.pathname +
      currentUrl.search +
      "#Intent;scheme=https;package=com.janstech.kauppalista;S.browser_fallback_url=" +
      encodeURIComponent(fallbackUrl) +
      ";end";

    document.getElementById("openApp").href = intentUrl;
  </script>
</body>
</html>
