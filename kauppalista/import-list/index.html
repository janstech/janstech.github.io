<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kauppalista & Muistiinpanot</title>
  <meta name="robots" content="noindex">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f3ff;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.14);
      text-align: center;
    }

    .app-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 14px;
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.55;
      color: #4b5563;
    }

    .button {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 18px;
      border-radius: 999px;
      background: #7c3aed;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .secondary {
      display: block;
      margin-top: 18px;
      font-size: 14px;
      color: #6b7280;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="app-logo"
      src="./kauppalista-logo.png"
      alt="Kauppalista & Muistiinpanot">

    <h1 id="title"></h1>

    <p id="body1"></p>
    <p id="body2"></p>

    <a
      id="button"
      class="button"
      href="https://play.google.com/store/apps/details?id=com.janstech.kauppalista">
    </a>

    <span id="secondary" class="secondary"></span>
  </main>

    const rawLang = (navigator.language || "en").toLowerCase();
    const lang = rawLang.split("-")[0];
    const t = texts[lang] || texts.en;

    document.documentElement.lang = texts[lang] ? lang : "en";
    document.getElementById("title").textContent = t.title;
    document.getElementById("body1").textContent = t.body1;
    document.getElementById("body2").textContent = t.body2;
    document.getElementById("button").textContent = t.button;
    document.getElementById("secondary").textContent = t.secondary;
  </script>
</body>
</html>
